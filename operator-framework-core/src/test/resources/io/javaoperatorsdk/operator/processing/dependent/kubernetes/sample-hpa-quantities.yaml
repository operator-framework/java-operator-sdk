# actual HorizontalPodAutoscaler with target quantities in the canonical form stored by the API server
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  managedFields:
    - manager: controller
      operation: Apply
      apiVersion: autoscaling/v2
      time: '2026-11-06T10:00:00Z'
      fieldsType: FieldsV1
      fieldsV1:
        f:spec:
          f:maxReplicas: { }
          f:metrics: { }
          f:minReplicas: { }
          f:scaleTargetRef:
            f:apiVersion: { }
            f:kind: { }
            f:name: { }
  name: "test"
  uid: 0d6f5b8e-2c1a-4f3e-9b7d-5a4c3b2a1f00
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: test
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: External
      external:
        metric:
          name: queue-depth
        target:
          type: AverageValue
          averageValue: "1k"
    - type: Object
      object:
        describedObject:
          apiVersion: v1
          kind: Service
          name: test
        metric:
          name: requests-per-second
        target:
          type: Value
          value: "2"
    - type: Pods
      pods:
        metric:
          name: packets-per-second
        target:
          type: AverageValue
          averageValue: "500m"
    - type: Resource
      resource:
        name: memory
        target:
          type: AverageValue
          averageValue: "1Gi"
    - type: ContainerResource
      containerResource:
        name: cpu
        container: app
        target:
          type: AverageValue
          averageValue: "1500m"
