# desired HorizontalPodAutoscaler with numerically equal, non-canonical target quantities
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: "test"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: test
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: External
      external:
        metric:
          name: queue-depth
        target:
          type: AverageValue
          averageValue: "1000"
    - type: Object
      object:
        describedObject:
          apiVersion: v1
          kind: Service
          name: test
        metric:
          name: requests-per-second
        target:
          type: Value
          value: "2000m"
    - type: Pods
      pods:
        metric:
          name: packets-per-second
        target:
          type: AverageValue
          averageValue: "0.5"
    - type: Resource
      resource:
        name: memory
        target:
          type: AverageValue
          averageValue: "1024Mi"
    - type: ContainerResource
      containerResource:
        name: cpu
        container: app
        target:
          type: AverageValue
          averageValue: "1.5"
