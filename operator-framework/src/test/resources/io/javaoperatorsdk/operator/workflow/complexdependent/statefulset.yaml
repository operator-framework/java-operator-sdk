apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: statefulset-template
  labels:
    app.kubernetes.io/name: statefulset-template
    app.kubernetes.io/component: first-or-second
spec:
  serviceName: statefulset-template
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: statefulset-template
  template:
    metadata:
      labels:
        app.kubernetes.io/name: statefulset-template
        app.kubernetes.io/component: first-or-second
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
