name: Parameterized Integration Tests

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        required: true
      kube-version:
        type: string
        required: true
      http-client:
        type: string
        required: false
        default: 'vertx'
      experimental:
        type: boolean
        required: false
        default: false
      checkout-ref:
        type: string
        required: false
        default: ''

jobs:
  integration_tests:
    name: Integration tests (${{ inputs.java-version }}, ${{ inputs.kube-version }}, ${{ inputs.http-client }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ inputs.experimental }}
    timeout-minutes: 120
    env:
      MINIKUBE_VERSION: v1.39.0
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref }}
      - name: Set up Java and Maven
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: 'maven'
      # minikube downloads kubelet, kubeadm and kubectl from dl.k8s.io on every start, which
      # regularly times out when many matrix jobs start at once
      - name: Cache Minikube downloads
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/.minikube/cache
          key: minikube-${{ runner.os }}-${{ env.MINIKUBE_VERSION }}-${{ inputs.kube-version }}-none
      - name: Set up Minikube
        id: minikube
        continue-on-error: true
        uses: manusa/actions-setup-minikube@v2.19.0
        with:
          minikube version: ${{ env.MINIKUBE_VERSION }}
          kubernetes version: '${{ inputs.kube-version }}'
          github token: ${{ github.token }}
      - name: Clean up failed Minikube setup
        if: steps.minikube.outcome == 'failure'
        run: sudo -E --preserve-env=HOME,MINIKUBE_HOME "$MINIKUBE_HOME/minikube" delete || true
      - name: Set up Minikube (retry)
        if: steps.minikube.outcome == 'failure'
        uses: manusa/actions-setup-minikube@v2.19.0
        with:
          minikube version: ${{ env.MINIKUBE_VERSION }}
          kubernetes version: '${{ inputs.kube-version }}'
          github token: ${{ github.token }}

      - name: "${{inputs.it-category}} integration tests (kube: ${{ inputs.kube-version }} / java: ${{ inputs.java-version }} / client: ${{ inputs.http-client }})"
        run: |
          if [ -z "${{inputs.it-category}}" ]; then
            it_profile="integration-tests"
          else
            it_profile="integration-tests-${{inputs.it-category}}"
          fi
          echo "Using profile: ${it_profile}"
          ./mvnw ${MAVEN_ARGS} -T1C -B install -DskipTests --file pom.xml
          ./mvnw ${MAVEN_ARGS} -T1C -B package -P${it_profile} -Dfabric8-httpclient-impl.name=${{inputs.http-client}} --file pom.xml
