apiVersion: v1
kind: ServiceAccount
metadata:
  name: virtual-threads-operator

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: virtual-threads-operator
spec:
  selector:
    matchLabels:
      app: virtual-threads-operator
  replicas: 1
  template:
    metadata:
      labels:
        app: virtual-threads-operator
    spec:
      serviceAccountName: virtual-threads-operator
      containers:
      - name: operator
        image: virtual-threads-operator
        imagePullPolicy: Never

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: virtual-threads-operator-admin
subjects:
- kind: ServiceAccount
  name: virtual-threads-operator
  namespace: default
roleRef:
  kind: ClusterRole
  name: virtual-threads-operator
  apiGroup: ""

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: virtual-threads-operator
rules:
- apiGroups:
  - "apiextensions.k8s.io"
  resources:
  - customresourcedefinitions
  verbs:
  - '*'
- apiGroups:
  - "sample.javaoperatorsdk"
  resources:
  - virtualthreadscustomresources
  - virtualthreadscustomresources/status
  verbs:
  - '*'
